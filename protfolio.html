<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hadia Tabassum | Portfolio</title>
    <style>
        body {
            background: linear-gradient(135deg, #74ebd5, #9face6);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .portfolio-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            background: #4a6cf7;
            color: white;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            margin: 0 auto 20px;
        }
        h1 { color: #333; margin: 10px 0; }
        .title { color: #4a6cf7; font-weight: 600; margin-bottom: 15px; }
        .bio { color: #666; font-size: 14px; line-height: 1.6; }
        .skills span {
            background: #f0f4ff;
            color: #4a6cf7;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            margin: 5px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="portfolio-card">
        <div class="avatar">HT</div>
        <h1>Hadia Tabassum</h1>
        <p class="title">Web Developer & Git Expert</p>
        <p class="bio">Main website banana aur Git/GitHub use karna seekh rahi hoon. Yeh mera pehla mukammal solo project hai!</p>
        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>Git</span>
        </div>
    </div>
</body>
</html>
