<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Haunted Project 👻</title>
  <!-- Tailwind Link -->
  <script src="https://tailwindcss.com"></script>
</head>
<!-- Khofnak background gradient aur mobile ke liye fully responsive alignment -->
<body class="bg-gradient-to-b from-black via-zinc-950 to-red-950 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 font-mono selection:bg-red-600 selection:text-white">

  <!-- Main Horror Card: Mobile par width single lane rahegi (w-full), standard screen par max-w-sm ya md ho jayegi -->
  <div class="w-full max-w-sm md:max-w-md bg-zinc-900 border-2 border-red-900/40 rounded-3xl shadow-[0_0_30px_rgba(153,27,27,0.3)] overflow-hidden transform hover:scale-102 hover:border-red-600 transition duration-500 ease-in-out">
    
    <!-- Top Red-Aura Banner -->
    <div class="h-28 sm:h-32 bg-gradient-to-b from-red-950 to-zinc-900 flex items-center justify-between px-6">
      <span class="animate-pulse bg-red-900/50 border border-red-600/50 text-red-500 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-widest shadow-[0_0_10px_rgba(220,38,38,0.5)]">
        🚨 Entity: Active
      </span>
      <span class="text-zinc-600 text-xs font-bold uppercase tracking-widest">Level 666</span>
    </div>

    <!-- Creepy Profile Image (Mobile optimized) -->
    <div class="flex justify-center -mt-16">
      <img class="w-28 h-28 sm:w-32 sm:h-32 object-cover rounded-full border-4 border-zinc-900 shadow-xl grayscale hover:grayscale-0 hover:scale-110 active:invert transition duration-500 cursor-skull" 
           src="https://unsplash.com" 
           alt="Ghost Face">
    </div>

    <!-- Card Body Content -->
    <div class="px-5 sm:px-8 py-6 text-center">
      <!-- Font size responsive hai (mobile par text-xl, medium screen par text-3xl) -->
      <h2 class="text-xl sm:text-2xl md:text-3xl font-extrabold text-red-600 tracking-wider uppercase mb-1 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">
        The Whispering Nun
      </h2>
      <p class="text-xs font-semibold text-zinc-500 tracking-widest uppercase mb-4">Class: Poltergeist</p>
      
      <p class="text-zinc-400 text-xs sm:text-sm leading-relaxed mb-6 bg-black/40 p-4 rounded-2xl border border-zinc-800/50">
        "Don't turn around. If you hear a soft whimper in the dark, it's already too late. She locks onto screens that stay open past midnight."
      </p>

      <!-- Creepy Badges Layout (Flex wrap handles mobile layout beautifully) -->
      <div class="flex flex-wrap justify-center gap-2 mb-6">
        <span class="bg-zinc-950 text-red-500/80 border border-red-950 text-[10px] sm:text-xs px-2.5 py-1 rounded-md font-mono">⚠️ Apparition</span>
        <span class="bg-zinc-950 text-red-500/80 border border-red-950 text-[10px] sm:text-xs px-2.5 py-1 rounded-md font-mono">🔊 Static Noises</span>
        <span class="bg-zinc-950 text-red-500/80 border border-red-950 text-[10px] sm:text-xs px-2.5 py-1 rounded-md font-mono">⏳ 03:00 AM</span>
      </div>

      <!-- Action Buttons Grid (Adapts to touch screens perfectly) -->
      <div class="grid grid-cols-2 gap-3">
        <button class="bg-red-700 hover:bg-red-600 text-white font-bold py-2.5 px-4 rounded-xl shadow-lg shadow-red-900/50 active:scale-95 transition duration-150 text-xs sm:text-sm uppercase tracking-wider">
          Exorcise
        </button>
        <button class="border-2 border-zinc-700 hover:border-red-800/80 hover:bg-zinc-950 text-zinc-400 hover:text-red-500 font-bold py-2.5 px-4 rounded-xl active:scale-95 transition duration-150 text-xs sm:text-sm uppercase tracking-wider">
          Manifest
        </button>
      </div>
    </div>

    <!-- Stats Section Grid -->
    <div class="bg-black/60 border-t border-zinc-800 grid grid-cols-3 py-4 text-center">
      <div>
        <span class="block text-base sm:text-lg font-bold text-red-600 drop-shadow-[0_0_5px_rgba(220,38,38,0.3)]">99%</span>
        <span class="text-[9px] sm:text-[10px] text-zinc-500 uppercase font-bold tracking-tight">Haunt Rate</span>
      </div>
      <div class="border-x border-zinc-800">
        <span class="block text-base sm:text-lg font-bold text-zinc-300">4,666</span>
        <span class="text-[9px] sm:text-[10px] text-zinc-500 uppercase font-bold tracking-tight">Victims</span>
      </div>
      <div>
        <span class="block text-base sm:text-lg font-bold text-zinc-300">Infinite</span>
        <span class="text-[9px] sm:text-[10px] text-zinc-500 uppercase font-bold tracking-tight">Lifespan</span>
      </div>
    </div>

  </div>

</body>
</html>
